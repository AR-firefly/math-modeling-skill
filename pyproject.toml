[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-modeling"
version = "2.0.0"
description = "数学建模国赛全流程 Skill v2.0：文献先行→求解→校验→论文生成→过程记录（含图契约/文献借鉴）"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "scipy>=1.9",
    "matplotlib>=3.7",
    "python-docx>=0.8.11",
    "scikit-learn>=1.2",
    "statsmodels>=0.14",
    "pymupdf>=1.24",   # PDF 文本提取 / 扫描页转图
]

[tool.setuptools.packages.find]
where = ["src"]
